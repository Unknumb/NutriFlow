name: Backup Diario de Base de Datos NutriFlow

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-database:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Ejecutar pg_dump desde Supabase
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="nutriflow_prod_${TIMESTAMP}.backup"
          /usr/lib/postgresql/17/bin/pg_dump $DB_URL -F c -b -v -f $BACKUP_FILE
          echo "BACKUP_NAME=$BACKUP_FILE" >> $GITHUB_ENV

      - name: Verificar integridad del backup
        run: |
          # pg_restore --list falla si el archivo no es un dump válido; además
          # confirmamos que el backup no está vacío y contiene objetos.
          test -s "$BACKUP_NAME" || { echo "ERROR: backup vacío"; exit 1; }
          OBJETOS=$(/usr/lib/postgresql/17/bin/pg_restore --list "$BACKUP_NAME" | grep -c ';' || true)
          echo "El backup contiene $OBJETOS entradas en su índice."
          test "$OBJETOS" -gt 0 || { echo "ERROR: el dump no lista objetos"; exit 1; }

      # El dump contiene datos sensibles de pacientes (Ley 21.719): se cifra
      # con AES-256 antes de subirlo y nunca se publica en texto plano.
      # Para descifrar: gpg --batch --passphrase "$BACKUP_ENCRYPTION_KEY" \
      #   --decrypt --output restore.backup nutriflow_prod_<fecha>.backup.gpg
      - name: Cifrar backup con GPG (AES-256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "ERROR: falta el secret BACKUP_ENCRYPTION_KEY; no se sube backup sin cifrar."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "${BACKUP_NAME}.gpg" "$BACKUP_NAME"
          rm "$BACKUP_NAME"
          echo "BACKUP_NAME=${BACKUP_NAME}.gpg" >> $GITHUB_ENV

      - name: Subir archivo de backup cifrado como Artefacto a GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nutriflow-database-backup
          path: ${{ env.BACKUP_NAME }}
          retention-days: 7
