name: CI

on:
  push:
    branches: ["main", "develop", "feature/**", "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

# Permisos mínimos: los jobs solo necesitan leer el código.
permissions:
  contents: read

jobs:
  backend-core:
    name: backend-core (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producto/backend-core
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: producto/backend-core/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

  frontend:
    name: frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producto/nutriflow-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: producto/nutriflow-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run

  backend-math:
    name: backend-math (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producto/backend-math
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias (runtime + dev)
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest services/test_calculadora.py -v
