name: CodeQL (SAST)

on:
  push:
    branches: ["main", "develop", "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    # Análisis semanal aunque no haya cambios (lunes 09:00 UTC).
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publicar hallazgos en la pestaña Security
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # JS/TS y Python son interpretados: CodeQL analiza el código fuente sin build.
      - name: Analizar
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
