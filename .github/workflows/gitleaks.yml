name: Secret Scanning (gitleaks)

on:
  push:
    branches: ["main", "feature/**", "chore/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detectar secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo para escanear todos los commits)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear repositorio (historial de git)
        run: gitleaks detect --config .gitleaks.toml --redact --verbose --exit-code 1
