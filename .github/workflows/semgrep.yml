name: Semgrep SAST

on:
  push:
    branches: ["main", "develop", "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  semgrep:
    name: Analizar con Semgrep
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    # Usamos el contenedor oficial directamente
    container:
      image: semgrep/semgrep

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Escanear con Semgrep (CLI Nativo)
        # SEMGREP_RULES es leído por el wrapper de semgrep-action, no por el CLI
        # nativo: al llamar "semgrep ci" directamente hay que pasar los rulesets
        # como --config explícitos o se ignoran silenciosamente.
        run: |
          semgrep ci \
            --config=p/default \
            --config=p/typescript \
            --config=p/python \
            --config=p/react \
            --config=p/fastapi \
            --config=p/nestjs \
            --config=p/jwt \
            --config=p/secrets \
            --sarif --output=semgrep.sarif

      - name: Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always()
        with:
          sarif_file: semgrep.sarif
