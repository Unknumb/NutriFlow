name: Semgrep SAST

on:
  push:
    branches: ["main", "develop", "feature/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  semgrep:
    name: Analizar con Semgrep
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    # Usamos el contenedor oficial directamente
    container:
      image: semgrep/semgrep

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Escanear con Semgrep (CLI Nativo)
        # SEMGREP_RULES es leído por el wrapper de semgrep-action, no por el CLI
        # nativo: al llamar "semgrep ci" directamente hay que pasar los rulesets
        # como --config explícitos o se ignoran silenciosamente.
        run: |
          semgrep ci \
            --config=p/default \
            --config=p/typescript \
            --config=p/python \
            --config=p/react \
            --config=p/fastapi \
            --config=p/nestjs \
            --config=p/jwt \
            --config=p/secrets \
            --sarif --output=semgrep.sarif

      - name: Subir resultados a GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: semgrep.sarif
