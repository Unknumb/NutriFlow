# Hooks locales de pre-commit para NutriFlow.
#
# Activación (una sola vez por clon del repo):
#   pip install pre-commit
#   pre-commit install
#
# A partir de ahí, gitleaks se ejecuta automáticamente en cada `git commit` y
# bloquea el commit si detecta un secreto. Para escanear todo el repo a demanda:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  # Higiene básica de archivos (seguros, no tocan el estilo del código TS/Py).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key # bloquea claves privadas commiteadas
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
